<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZCine · S01 状态补稿</title><link rel="stylesheet" href="../app/src/styles/tokens.css"><link rel="stylesheet" href="../app/src/styles/base.css"><link rel="stylesheet" href="../app/src/styles/app.css"><link rel="stylesheet" href="s01-storage.css"></head>
<body><header class="titlebar"><span class="preview-title">S01 · 设计状态预览 · 不保存数据</span><button class="theme-button" id="theme">切换深色</button></header><div class="app-shell"><aside class="side"><a class="brand" href="#setup"><img class="brand-lockup" src="../assets/brand/logo-lockup.png" alt="AZCine"></a><nav aria-label="补稿页面"><a class="nav-item" href="#setup">首次使用</a><a class="nav-item" href="#today">今天</a><a class="nav-item" href="#settings">设置</a></nav></aside><main class="workspace" data-page="setup"><header class="page-heading"><h1 tabindex="-1">把记录保存在本机</h1><span class="meta">S01 · 最小状态</span></header><div id="content"></div></main></div><script>
const main=document.querySelector('main'), content=document.querySelector('#content');
const states='<details class="state-preview"><summary>设计状态预览</summary><div class="form-actions"><button class="pill" data-state="loading">加载中</button><button class="pill" data-state="error">保存失败</button><button class="pill" data-state="success">已保存</button><button class="pill" data-state="empty">空列表</button></div></details>';
function render(){const route=location.hash.slice(1)||'setup';main.dataset.page=route;document.querySelectorAll('nav a').forEach(a=>a.toggleAttribute('aria-current',a.hash==='#'+route));document.querySelector('h1').textContent=route==='setup'?'把记录保存在本机':route==='today'?'今天':'设置';content.innerHTML=route==='setup'?'<section class="data-panel"><p class="subtle">待办、项目、附件与 Pi 资料都放在这个目录。</p><form class="entry-form"><label>数据目录<input value="D:\\Documents\\AZCineData" aria-describedby="root-help"></label><p id="root-help" class="meta">此路径为虚构示例。实际默认使用系统文档目录，可自行更改。</p><div class="form-actions"><button type="button" class="pill">选择目录</button><button class="pill on">使用此目录</button></div></form></section>':route==='settings'?'<section class="data-panel"><h2>数据目录</h2><p class="path-text">D:\\Documents\\AZCineData</p><button class="pill">打开目录</button><p class="meta">完整迁移与备份在 S13 接入；不会自动删除旧目录。</p></section>':'<div class="today-cards today-cards-b"><section class="today-card review-card"><h2>还没有可核对的变更</h2></section><section class="today-card today-tasks-card"><header class="card-heading"><h2>今天要做</h2></header><form class="entry-form"><label>待办标题<input value="检查灯光预览" required></label><label>日期（可选）<input type="date"></label><p class="meta">暂无公司项目，可先不关联。</p><button class="pill on">保存待办</button></form><div class="form-actions"><button class="pill on">未完成</button><button class="pill">今天</button><button class="pill">已完成</button></div><ul class="todo-list"><li><label class="todo-toggle"><input type="checkbox"><span>整理镜头参考</span></label><span class="meta">未设日期</span></li></ul></section><section class="today-card today-delivery-card"><h2>接下来交付</h2><div class="foundation-empty"><p>暂无交付记录</p></div></section><section class="today-card today-news-card"><h2>今日资讯</h2><div class="foundation-empty"><p>暂无资讯刊期</p></div></section></div>';content.insertAdjacentHTML('beforeend','<p class="feedback" role="status"></p>'+states);document.querySelector('h1').focus();}
window.addEventListener('hashchange',render);render();document.querySelector('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('#theme').textContent=dark?'切换浅色':'切换深色';};document.addEventListener('submit',e=>e.preventDefault());document.addEventListener('click',e=>{if(!e.target.dataset.state)return;const state=e.target.dataset.state;document.querySelector('.feedback').textContent=({loading:'正在保存，请稍候。',error:'保存失败，请检查磁盘空间与写入权限；输入已保留，可重试。',success:'已保存（仅设计预览）。',empty:'暂无待办，先记下一件事。'})[state];document.querySelector('.feedback').dataset.kind=state;});
</script></body></html>
