<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZCine · S03 模型与会话状态</title><link rel="stylesheet" href="../app/src/styles/tokens.css"><link rel="stylesheet" href="../app/src/styles/base.css"><link rel="stylesheet" href="../app/src/styles/app.css"><link rel="stylesheet" href="s03-agent.css"></head>
<body><header class="titlebar"><span class="preview-title">S03 · 设计状态预览 · 虚构会话，不调用模型</span><button class="theme-button" id="theme">切换深色</button></header>
<div class="app-shell"><aside class="side"><a class="brand" href="#agent"><img class="brand-lockup" src="../assets/brand/logo-lockup.png" alt="AZCine"></a><nav aria-label="补稿页面"><a class="nav-item" href="#agent">Agent</a><a class="nav-item" href="#settings">模型设置</a></nav></aside>
<main class="workspace"><header class="page-heading"><h1 tabindex="-1">Agent</h1><span class="meta">S03 · 最小状态</span></header><div id="content"></div></main></div>
<script>
const modelDraft={provider:'studio-proxy',url:'https://api.example.invalid/v1',model:'example-model',key:''};let draft='帮我梳理镜头测试的检查顺序',state='unconfigured',route='agent';const content=document.querySelector('#content');
const labels={unconfigured:'未配置',connecting:'连接中',empty:'空会话',streaming:'回复与工具',stopping:'停止中',interrupted:'已中断',disconnected:'断连',restored:'恢复会话',unsupported:'图片不支持',configerror:'配置失败',saved:'配置已保存'};
const preview=()=>'<details class="preview-states"><summary>设计状态预览（不执行）</summary><div class="actions">'+Object.entries(labels).map(([key,label])=>'<button class="pill" data-state="'+key+'">'+label+'</button>').join('')+'</div></details>';
const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function render(){route=location.hash==='#settings'?'settings':'agent';document.querySelector('main').dataset.page=route;document.querySelector('h1').textContent=route==='settings'?'模型设置':'Agent';document.querySelectorAll('nav a').forEach(a=>{if(a.hash==='#'+route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
if(route==='settings'){content.innerHTML='<section class="model-settings"><h2>模型连接</h2><p class="subtle">使用你自己配置的服务；不读取其他 Pi 的认证。</p><form class="model-form"><label>服务标识<input data-field="provider" value="'+escape(modelDraft.provider)+'"></label><label>服务地址<input data-field="url" value="'+escape(modelDraft.url)+'" type="url"></label><label>原生 API 类型<select><option>OpenAI Responses</option><option>OpenAI Chat Completions</option><option>Anthropic Messages</option></select></label><label>模型 ID<input data-field="model" value="'+escape(modelDraft.model)+'"></label><label>API Key<input data-field="key" type="password" autocomplete="off" value="'+escape(modelDraft.key)+'" placeholder="仅在应用内输入，不在聊天中提供"></label><p class="meta">已保存的 Key 不回填；留空保留原值。此稿不保存、不联网。</p><div class="model-limits"><label>上下文长度<input type="number" value="128000"></label><label>最大输出<input type="number" value="8192"></label></div><label class="check-field"><input type="checkbox">此模型支持图片（按服务实际能力填写）</label><button class="pill on" type="submit">保存连接设置</button></form><p class="feedback" role="status">'+(state==='configerror'?'配置未保存，输入仍保留。请检查地址与原生 API 类型。':state==='saved'?'设置已保存（状态示意），尚未验证模型实际响应。':'示例地址和模型均为虚构，不代表任意反代都能自动枚举模型。')+'</p><details><summary>本应用 Pi 与工作目录</summary><dl class="runtime-info"><dt>上游版本</dt><dd>0.99.1（候选，独立原版）</dd><dt>资源归属</dt><dd>AZCine 自有 runtime / 数据根 pi/agent / pi/sessions</dd><dt>当前工作目录</dt><dd>本应用的独立工作目录</dd></dl><p class="subtle">外部目录含旧 .pi/commands 时，原版可能自动迁移；接入检查未通过不会启动或修改该目录。</p><p class="meta">原生自定义资源初始为空，扩展与 TUI 完整交接在 S04 接入。</p></details></section>'+preview();}
else {const unavailable=['unconfigured','connecting','disconnected'].includes(state),running=['streaming','stopping'].includes(state);let message='';
if(state==='streaming'||state==='stopping')message='<article class="message user-message"><strong>你</strong><p>梳理镜头测试的检查顺序。</p></article><article class="message"><strong>Agent · 虚构状态示意</strong><p>先核对原始镜头记录，再检查日期与当前标签。</p><details class="tool-line"><summary>read · 已结束 · 示例 notes.txt</summary><pre>示例工具结果：镜头 SH-010，当前阶段 ACOPY。</pre></details><details class="tool-line" open><summary>bash · 进行中</summary><pre>正在检查测试结果……（虚构过程，不执行命令）</pre></details><p class="feedback" role="status">'+(state==='stopping'?'正在停止，未完成的步骤不会标成成功。':'正在回复，可停止或继续输入。')+'</p></article>';
else if(state==='restored')message='<article class="message user-message"><strong>你</strong><p>之前的镜头测试如何安排？</p></article><article class="message"><strong>Agent · 会话恢复示意</strong><p>已恢复原会话的消息与工具记录；未重新发送上一条消息。</p><details class="tool-line"><summary>read · 已结束</summary><pre>原始结果保留，不把历史工具重新执行。</pre></details></article>';
else message='<div class="chat-empty"><h2>'+({unconfigured:'请先配置模型',connecting:'正在连接本应用 Pi',empty:'从一条消息开始',interrupted:'本次已中断',disconnected:'连接已断开',unsupported:'当前模型不支持图片'}[state]||'从一条消息开始')+'</h2><p class="subtle">'+({unconfigured:'可以先写下问题。配置完成后再发送，输入不会丢失。',connecting:'等待真实状态响应，不把进程已启动当连接成功。',empty:'直接提问，或按原生方式调用自己的 Skill。',interrupted:'未完成的工具步骤没有标为成功；排队文字已回到输入区。',disconnected:'消息与输入已保留。重新连接后核对原会话，不自动重发。',unsupported:'附件仍保留。可换支持图片的模型，或改为文字描述。'}[state]||'当前会话没有消息。')+'</p>'+(state==='unconfigured'?'<a class="pill on" href="#settings">配置模型</a>':state==='disconnected'?'<button class="pill" data-action="reconnect">重新连接</button>':'')+'</div>';
content.innerHTML='<div class="agent-layout"><details class="session-list" open><summary>会话</summary><button class="pill" data-action="new">新建会话</button><div class="session-items"><button class="session-item" aria-current="true" data-action="current">镜头测试准备</button><button class="session-item" data-action="restore">恢复示例会话</button></div></details><section class="chat-main" aria-label="通用会话"><header class="chat-heading"><h2>镜头测试准备</h2><span class="meta">'+(unavailable?'未连接可用模型':'example-model · 状态示意')+'</span></header><div class="chat-messages">'+message+'</div><form class="composer"><label for="prompt">消息</label><textarea id="prompt" rows="4" placeholder="直接提问，不限于固定业务按钮">'+escape(draft)+'</textarea><div class="composer-actions"><span class="meta">Enter 发送 · Shift+Enter 换行</span><button class="pill on" type="submit" '+(unavailable||state==='stopping'||state==='unsupported'?'disabled':'')+'>'+(running?'排入后续':'发送')+'</button>'+(running?'<button class="pill" type="button" data-action="stop" '+(state==='stopping'?'disabled':'')+'>停止</button>':'')+'</div><p class="meta">此稿只切换状态，不调用模型；生产输入与会话分别保留。</p></form></section></div>'+preview();}
}
window.addEventListener('hashchange',()=>{render();document.querySelector('h1').focus();});render();document.querySelector('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('#theme').textContent=dark?'切换浅色':'切换深色';};document.addEventListener('input',event=>{if(event.target.id==='prompt')draft=event.target.value;if(event.target.dataset.field)modelDraft[event.target.dataset.field]=event.target.value;});document.addEventListener('submit',event=>{event.preventDefault();state=route==='settings'?'saved':'streaming';render();});document.addEventListener('click',event=>{if(event.target.dataset.state){state=event.target.dataset.state;render();document.querySelector('.preview-states').open=true;}const a=event.target.dataset.action;if(a){state=({new:'empty',current:'empty',restore:'restored',reconnect:'connecting',stop:'interrupted'})[a];render();}});document.addEventListener('keydown',event=>{if(event.target.id==='prompt'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();const button=document.querySelector('.composer button[type=submit]');if(!button.disabled)button.click();}});
</script></body></html>
