[package]
name = "azcine"
version = "0.0.0"
description = "AZCine local desktop workspace"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "azcine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
tempfile = "=3.27.0"
serde_json = "=1.0.151"
url = "=2.5.8"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"]
